[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omacast"
version = "0.1.1"
description = "Miracast desktop casting for Omarchy"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  {name = "Hardie Pienaar"}
]
dependencies = []

[project.scripts]
omacast = "omarchy_cast.cli:main"
omarchy-cast = "omarchy_cast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
